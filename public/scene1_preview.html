<!DOCTYPE html>
<html>
<head>
  <title>Scene 1: The Void</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info { position: absolute; top: 20px; left: 20px; color: #fff; font-family: monospace; font-size: 14px; z-index: 10; }
  </style>
</head>
<body>
  <div id="info">Scene 1: The Void — particles converging + central point pulsing<br>(Simulated preview — real version uses Remotion/Three.js)</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 12;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Particles converging from sphere shell inward
    const particleCount = 300;
    const radius = 10;
    const positions = new Float32Array(particleCount * 3);
    const velocities = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      // Start on sphere shell
      const phi = Math.acos(2 * Math.random() - 1);
      const theta = 2 * Math.PI * Math.random();
      positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = radius * Math.cos(phi);

      // Random inward velocity
      velocities[i * 3] = (Math.random() - 0.5) * 0.02;
      velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMaterial = new THREE.PointsMaterial({
      size: 0.12,
      color: 0xffffff,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particleSystem);

    // Central pulsing sphere
    const sphereGeometry = new THREE.SphereGeometry(0.3, 32, 32);
    const sphereMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.8
    });
    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    scene.add(sphere);

    // Animate
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.02;

      // Move particles inward
      const pos = particleGeometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        pos[i * 3] += velocities[i * 3];
        pos[i * 3 + 1] += velocities[i * 3 + 1];
        pos[i * 3 + 2] += velocities[i * 3 + 2];

        // Reset particles that converge to center
        const dist = Math.sqrt(pos[i*3]**2 + pos[i*3+1]**2 + pos[i*3+2]**2);
        if (dist < 1.5) {
          const phi = Math.acos(2 * Math.random() - 1);
          const theta = 2 * Math.PI * Math.random();
          pos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          pos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
          pos[i * 3 + 2] = radius * Math.cos(phi);
        }
      }
      particleGeometry.attributes.position.needsUpdate = true;

      // Pulse the central sphere
      const scale = 1 + Math.sin(time * 2) * 0.08;
      sphere.scale.setScalar(scale);
      sphere.material.opacity = 0.6 + Math.sin(time) * 0.3;
      particleMaterial.opacity = 0.4 + Math.sin(time * 0.5) * 0.1;

      // Slow scene rotation for cinematic feel
      particleSystem.rotation.y += 0.0003;
      particleSystem.rotation.x += 0.0001;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
